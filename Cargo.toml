[workspace]
resolver = "2"
members = [
    "crates/foundation",
    "crates/platform",
    "crates/resources",
    "crates/mercury",
    "crates/contracts",
    "crates/entitydef",
    "crates/python-host",
    "crates/server-runtime",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/cuihairu/boundless"

[workspace.dependencies]
# External dependencies.
libc = "0.2"

# Internal crates, dependency direction: apps -> role runtimes -> contracts &
# domain libs -> foundation (BW-16-01).
foundation = { path = "crates/foundation" }
# platform = { path = "crates/platform" }  # re-add with first consumer
resources = { path = "crates/resources" }
# mercury = { path = "crates/mercury" }  # re-add at BW-02
# contracts = { path = "crates/contracts" }  # re-add when a role runtime consumes it
# entitydef = { path = "crates/entitydef" }  # re-add at BW-02+
# python-host = { path = "crates/python-host" }  # re-add at BW-03
server-runtime = { path = "crates/server-runtime" }

[profile.release]
opt-level = 3
debug = true
