[workspace]
resolver = "2"
members = [
    "crates/foundation",
    "crates/platform",
    "crates/resources",
    "crates/mercury",
    "crates/contracts",
    "crates/entitydef",
    "crates/chunk",
    "crates/compiled-space",
    "crates/scene",
    "crates/terrain",
    "crates/physics",
    "crates/waypoint",
    "crates/waypoint-gen",
    "crates/db",
    "crates/db-postgres",
    "crates/python-host",
    "crates/python-module",
    "crates/server-runtime",
    "crates/test-support",
    "crates/asset-pipeline",
    "crates/python-module",
    "crates/plugin-host",
    "crates/launcher",
    "crates/watcher",
    "crates/message_logger",
    "crates/profiler",
    "crates/client",
    "crates/load",
    "apps/bots",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
repository = "https://github.com/cuihairu/boundless"

[workspace.dependencies]
# External dependencies.
libc = "0.2"
# Definition digest (BW-04-01-05): the reference `MD5::Digest::quote()` is
# 32 nibbles of uppercase hex, which is this crate's digest bytes upper-cased.
md-5 = "0.10"
# Asset rules / directory dependency patterns (the reference uses RE2).
regex = "1"
sha2 = "0.10"
# Blowfish ECB for the session encryption (BW-02-05-02): the reference uses
# OpenSSL's `BF_set_key`/`BF_ecb_encrypt`; this crate is the standard Blowfish
# (wire-tested against Eric Young's published vectors in the unit tests).
blowfish = "0.9"
# PostgreSQL wire client for the BW-09-06 storage backend (sync libpq
# conventions; JSONB columns carry the nested property values).
postgres = "0.19"
# JSON encoding for the JSONB columns (the nested PropertyValue codec).
serde_json = "1"

# Internal crates, dependency direction: apps -> role runtimes -> contracts &
# domain libs -> foundation (BW-16-01).
foundation = { path = "crates/foundation" }
load = { path = "crates/load" }
platform = { path = "crates/platform" }
resources = { path = "crates/resources" }
watcher = { path = "crates/watcher" }
mercury = { path = "crates/mercury" }
contracts = { path = "crates/contracts" }
entitydef = { path = "crates/entitydef" }
db = { path = "crates/db" }
db-postgres = { path = "crates/db-postgres" }
scene = { path = "crates/scene" }
# The chunk space faces: the client's findDropPoint / navigatePathPoints
# query faces run the obstacle sweep and the waypoint walk over it;
# test-support's unified-resource-entry proof (BW-16-04-02) drives the
# editor family's space publishing through the same BwResource the tool
# and app faces take.
chunk = { path = "crates/chunk" }
# The collision faces (world triangles, BSP trees, portal pass-through,
# quad trees); the chunk space obstacle sweep is the first consumer.
physics = { path = "crates/physics" }
python-host = { path = "crates/python-host" }
# The profiler frame and counter compatibility layer (BW-12-03-01); the
# `_bw_profile` module (BW-12-03-02) records through its `g_profiler`
# global.
profiler = { path = "crates/profiler" }
server-runtime = { path = "crates/server-runtime" }
# The waypoint navigation mesh reader/search (BW-10-04/05); server-runtime's
# MeshNavigator (BW-10-06-01) is the first runtime consumer.
waypoint = { path = "crates/waypoint" }
client = { path = "crates/client" }  # replay_write round-trips through its reader (BW-07-05-02)
# The log ingestion protocol codecs (OPT-02-01-04): the mixed-version
# rerun speaks the register/record envelopes to the reference EL7 logger.
message_logger = { path = "crates/message_logger" }
# load = { path = "crates/load" }  # re-add with first consumer
# test-support = { path = "crates/test-support" }  # re-add with first consumer
asset-pipeline = { path = "crates/asset-pipeline" }
terrain = { path = "crates/terrain" }
# plugin-host = { path = "crates/plugin-host" }  # re-add with first consumer
# launcher = { path = "crates/launcher" }  # re-add with first consumer

[profile.release]
opt-level = 3
debug = true
# OPT-14-01-02: the packaged server shipped 111 MiB of debuginfo in a
# 116 MiB binary; strip it from the installed artifact. Symbols are useful
# in a local debug build, not in the shipped tarball — the baseline and
# first-run measurements are in docs/review/opt-14-01-02-package-layout.md.
strip = "symbols"
