[package]
name = "server-runtime"
description = "BW-01 process bootstrap, configuration and the game tick"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
foundation = { workspace = true }
libc = { workspace = true }
contracts = { workspace = true }
platform = { workspace = true }
sha2 = { workspace = true }  # the signal syscalls land here (BW-16-02-01)
# mercury: the dispatcher's network pass is `mercury::poller::EventPoller`
# (BW-02-01-05); a legal downward edge into the domain layer.
mercury = { workspace = true }
resources = { workspace = true }
# Replay tick compression (BW-07-05-03): the reference's `ZipOStream`
# (`lib/network/zip_stream.cpp`). rust_backend keeps it pure Rust
# (miniz_oxide), so the workspace gate needs no system zlib.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
