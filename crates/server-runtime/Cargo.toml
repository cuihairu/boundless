[package]
name = "server-runtime"
description = "BW-01 process bootstrap, configuration and the game tick"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
foundation = { workspace = true }
libc = { workspace = true }
contracts = { workspace = true }
platform = { workspace = true }
# dbapp storage startup (BW-09-06-01): a downward edge into the domain layer.
db = { workspace = true }
sha2 = { workspace = true }  # the signal syscalls land here (BW-16-02-01)
# Replay signing (BW-07-05-02): the reference's `MD5SumScheme` is a 16-byte
# MD5 signature over the bytes read so far.
md-5 = { workspace = true }
# Replay tick-data compression (BW-07-05-03): `ZipOStream`/`CompressionOStream`
# (`lib/network/compression_stream.cpp`), the same pure-Rust zlib backend the
# client reader declares.
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }


# mercury: the dispatcher's network pass is `mercury::poller::EventPoller`
# (BW-02-01-05); a legal downward edge into the domain layer.
mercury = { workspace = true }
resources = { workspace = true }
# The Controller/Extra sample's grenade simulation reflects off a
# `WorldTriangle` (BW-14-02-04, `worldtri.cpp:504-512`); a downward edge
# into the domain layer like mercury/db above.
physics = { path = "../physics" }

# The navigation mesh: `MeshNavigator` (BW-10-06-01) implements the
# navigation controller's `Navigator` boundary over waypoint's two-level
# search — the same downward-edge pattern as db/mercury.
waypoint = { workspace = true }

# The auction pages' `eregi` criteria matching (BW-14-03-04) is POSIX
# ERE; the regex crate covers the same common forms.
regex = { workspace = true }

[dev-dependencies]
# BW-16-02-03 backend-isolation proof: the postgresql driver is exercised
# from outside its own crate.
db-postgres = { workspace = true }

# The fantasydemo login acceptance (BW-14-01-02) parses the fixture's
# entity defs; the DBApp storage def face is built from the parsed map.
entitydef = { workspace = true }

# Performance baselines (perf-bench batch 1): the update-loop dispatch bench.
criterion = "0.8"

# The ported replay reader (parse_header/parse_metadata/parse_tick_chunks,
# BW-11-03-01/02) is the acceptance reader for the written file
# (BW-07-05-02/03: what the writer produces must parse back losslessly).
client = { workspace = true }

# OPT-12-01-01: the observation channels' cost baseline drives the Watcher
# registry, the MessageLogger entry writer and the profiler global from
# outside their own crates (test-only edges; message_logger is a member,
# not a workspace dependency, so it takes the physics-style path edge).
watcher = { workspace = true }
profiler = { workspace = true }
message_logger = { path = "../message_logger" }

[[bench]]
name = "tick"
harness = false
