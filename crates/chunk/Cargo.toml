[package]
name = "chunk"
description = "BW-10-01 chunk identifiers, boundaries, portals and streaming bind"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
foundation = { workspace = true }
# The obstacle sweep runs on the physics faces (BW-10-03): BSP trees, the
# quad tree and the sweep parameter/state plumbing.
physics = { workspace = true }
# Chunk files are XML DataSections on a resource search path (BW-01-03), so the
# section reader is needed here.
resources = { workspace = true }
# Space publishing writes terrain blocks per chunk (BW-13-03-06, the
# WorldEditor SpaceRecreator face); the terrain crate carries that block.
terrain = { workspace = true }