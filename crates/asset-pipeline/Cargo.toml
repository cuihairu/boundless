[package]
name = "asset-pipeline"
description = "BW-13 dependency discovery, conversion and compilation"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
foundation = { workspace = true }
physics = { path = "../physics" }
regex = { workspace = true }
resources = { workspace = true }
# The chunk `.cdata` height maps decode through the terrain2 readers
# (`world_machine_import.rs`).
terrain = { workspace = true }

[dev-dependencies]
# The `.animation` reader face (`Animation::from_bytes`) the exporter's
# acceptance round-trips through (BW-13-05-02; the reader landed with
# BW-11-04-01). Tests only — no library dependency.
client = { path = "../client" }
compiled-space = { path = "../compiled-space" }
