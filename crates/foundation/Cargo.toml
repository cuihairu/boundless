[package]
name = "foundation"
description = "BW-01 shared ids, clocks, math and byte codecs"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
no-default-features = true

[dependencies]
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Performance baselines (perf-bench batch 1): criterion micro benches in
# benches/ (math, time queue, stream codec).
criterion = "0.8"

[[bench]]
name = "math"
harness = false

[[bench]]
name = "time_queue"
harness = false

[[bench]]
name = "stream"
harness = false
