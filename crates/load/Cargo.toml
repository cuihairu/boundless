[package]
name = "load"
description = "BW-17 load-test scenario input definitions and result aggregation"
edition.workspace = true
publish = false
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The bot movement faces carry Vector3 positions, ported from the same
# `lib/math/` scalar path the reference builds.
foundation = { workspace = true }
# Scenario documents are XML DataSections (the reference Bots read their
# config through the same `BWConfig`/DataSection style), so the section
# reader is needed here.
resources = { workspace = true }
# The four bots command callables ride the watcher protocol machinery
# (BW-17-01-06): a legal domain-to-domain edge.
watcher = { workspace = true }
