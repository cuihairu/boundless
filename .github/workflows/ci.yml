name: CI

# Per-push / per-PR gate for Boundless.
#
# Everything here is a call into a ci/ entrypoint, so a developer's terminal
# and this workflow exercise the same code path (todo.md BW-22-01-02). The
# `changes` job picks the lanes from the changed paths (BW-22-01-05): a
# markdown-only push never touches the Rust toolchain, and a push that only
# touches ci/ proves the harness still bites instead of gating the engine.
#
# Rust gates are scoped to the crates the change touches. A crate's own
# lane stays responsible for its own formatting and lint; a change to the
# workspace manifest widens build and test to the whole graph instead.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      # The three-leg matrix follows the code a runner executes, so it is
      # quiet on a markdown or ci/ change. This knob runs it on demand, which is
      # also how a new runner image gets smoke-tested.
      runners:
        description: Run the three-leg runner matrix
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select lanes from the changed paths
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      lanes: ${{ steps.plan.outputs.lanes }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      rust_all: ${{ steps.plan.outputs.rust_all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # The base diff needs history, and a scheduled rebuild of an old
          # ref needs the same checkout to reproduce.
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          GH_BASE: ${{ github.base_ref }}
        run: |
          # A pull_request has github.base_ref; a push event does not. Diffing a
          # push against main's tip would re-test everything another branch has
          # pushed since this one diverged, so measure push events from the
          # fork point instead.
          if [ -n "$GH_BASE" ]; then
            base="origin/$GH_BASE"
          else
            base="$(git merge-base origin/main HEAD)"
          fi
          ci/changes.sh --machine "$base" HEAD >>"$GITHUB_OUTPUT"

  toolchain:
    name: Toolchain pin and lockfile
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'toolchain')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No toolchain input: read rust-toolchain.toml, which is the pin
          # under test. Caching is off here deliberately — this job's whole
          # point is that the checkout resolves 1.100.0.
          cache: false

      - name: Python (pinned by .python-version)
        uses: actions/setup-python@v6
        with:
          # Same deal as the Rust step: no version input, read the pin
          # file under test.
          python-version-file: .python-version

      # The lane warms its own registry from Cargo.lock before building
      # offline: on a clean runner `cargo build --offline` has an empty
      # registry and fails with nothing wrong at all.
      - name: Verify
        run: ci/toolchain-check.sh --offline

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-toolchain-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  rust-static:
    name: Rust format and lint
    needs: changes
    if: >-
      contains(needs.changes.outputs.lanes, 'rust') &&
      (needs.changes.outputs.rust_packages != '' || needs.changes.outputs.rust_all == '1')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The components are declared, not assumed: this job's whole product is
      # cargo fmt and cargo clippy, and the setup action passes an empty
      # component list by default — one install path then ships a minimal
      # profile and the lane fails with "'cargo-fmt' is not installed".
      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          components: rustfmt clippy

      - name: Format and lint
        run: |
          scope="${{ needs.changes.outputs.rust_packages }}"
          if [ -n "$scope" ]; then
            ci/check-rust.sh all --packages "$scope"
          else
            # Nothing in the crate sources moved, but the manifest may have,
            # so formatting and linting stay skipped here and build/test below
            # run the whole graph.
            ci/check-rust.sh all --packages ""
          fi

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-rust-static-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  rust-build-test:
    name: Rust build and test
    needs: changes
    if: >-
      contains(needs.changes.outputs.lanes, 'rust') &&
      (needs.changes.outputs.rust_packages != '' || needs.changes.outputs.rust_all == '1')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build and test
        run: |
          scope="${{ needs.changes.outputs.rust_packages }}"
          if [ -n "$scope" ]; then
            ci/check-rust.sh build --packages "$scope"
            ci/check-rust.sh test --packages "$scope"
          else
            ci/check-rust.sh build
            ci/check-rust.sh test
          fi

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-rust-build-test-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  python:
    name: Python checks
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'python')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Python
        uses: actions/setup-python@v6
        with:
          # The single pin file, same pattern as rust-toolchain.toml.
          python-version-file: .python-version

      # Only worth installing once tests/python exists (BW-18).
      - name: Install pytest when there is Python to gate
        if: hashFiles('tests/python/**/*.py', 'scripts/**/*.py') != ''
        run: pip install pytest

      - name: Check
        run: ci/check-python.sh

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-python-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  typescript:
    name: TypeScript checks
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'typescript')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The lane installs each project's own devDependencies before
      # typechecking — a tsconfig without its types reports missing @types
      # instead of defects. A pnpm-locked project needs pnpm to do that
      # reproducibly; npm projects use the npm that setup-node provides.
      - name: pnpm for pnpm-locked projects
        run: npm install --no-fund --no-audit --global pnpm@12

      - name: Check
        run: ci/check-typescript.sh

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-typescript-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  docs:
    name: Documentation site and links
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'docs')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The docs tree (BW-19) installs with pnpm from docs/package.json;
      # the lane installs the deps itself, so only the tool is needed here.
      - name: pnpm for the docs tree
        run: npm install --no-fund --no-audit --global pnpm@12

      - name: Check
        run: ci/check-docs.sh

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-docs-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-02-01 — one leg per operating system. Every leg calls the same
  # entrypoint, so the three startup records come out of one code path; a leg
  # that cannot build yet records why instead of being averaged away.
  #
  # This job deliberately ignores vars.CI_RUNNER: one self-hosted runner cannot
  # be three operating systems at once, and that is the whole point of the
  # matrix.
  #
  # It reports rather than gates. Only Linux x86-64 is a started platform
  # target (docs/architecture/compatibility-matrix.md, BW-15-02); Windows and
  # macOS are not started, and macOS in particular does not compile yet:
  # crates/server-runtime/src/signals.rs uses libc::SIGRTMIN / SIGRTMAX /
  # sigwaitinfo, which exist only on Linux. Failing the whole push for that
  # would hide the record that is this job's product, so the legs are
  # continue-on-error and the truth lives in the uploaded startup records.
  #
  # Flip this to gating by dropping continue-on-error once the other two
  # targets are started.
  runners:
    name: Server startup on every runner
    needs: changes
    continue-on-error: true
    if: >-
      contains(needs.changes.outputs.lanes, 'runners') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.runners == 'true')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three first-batch targets of BW-15-02..04.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Start every server role
        run: ci/runners.sh

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-runners-${{ matrix.os }}-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-02-02 / 03 — the storage cases run against a real backend. MySQL and
  # PostgreSQL arrive as service containers, because a clean runner has neither
  # server; ci/store.sh reaches them over the mapped ports and provisions
  # nothing itself. SQLite and XML need no server at all — a private file and a
  # private directory — so they run wherever the lane runs.
  #
  # A change that only moves a case file still runs the lane: the cases are the
  # contract, and a case that no backend can satisfy is exactly what must be
  # caught here rather than at release time.
  storage:
    name: Storage cases on a real backend
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'store')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boundless
          POSTGRES_PASSWORD: boundless
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U boundless"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # The lane probes for mysql/psql; on an image that ships neither, an
      # apt-get is the difference between a PASS and a SKIP that hides nothing.
      - name: Storage clients
        run: |
          missing=()
          if ! command -v mysql >/dev/null 2>&1 && ! command -v mariadb >/dev/null 2>&1; then
            missing+=("default-mysql-client")
          fi
          command -v psql >/dev/null 2>&1 || missing+=("postgresql-client")
          command -v sqlite3 >/dev/null 2>&1 || missing+=("sqlite3")
          if [ ${#missing[@]} -gt 0 ]; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update -qq && sudo apt-get install -y -qq "${missing[@]}"
            else
              apt-get update -qq && apt-get install -y -qq "${missing[@]}"
            fi
          fi

      # The XML leg validates its cases with the standard library, so it needs
      # a known Python rather than whatever the image happens to ship.
      - name: Python
        uses: actions/setup-python@v6
        with:
          # The single pin file, same pattern as rust-toolchain.toml.
          python-version-file: .python-version

      - name: Run the storage cases
        env:
          CI_STORE_MYSQL_HOST: 127.0.0.1
          CI_STORE_MYSQL_PORT: '3306'
          CI_STORE_MYSQL_USER: root
          CI_STORE_MYSQL_PASSWORD: root
          CI_STORE_PG_HOST: 127.0.0.1
          CI_STORE_PG_PORT: '5432'
          CI_STORE_PG_PASSWORD: boundless
        run: |
          # The self-test lives here rather than in the harness job because it
          # needs a MySQL server, which only this job has.
          ci/store.sh self-test
          ci/store.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-storage-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-02-04 — the compatibility differential. Our replacement and the
  # original `process_defs` get the same .def; the lane fails when our checker
  # does not report what the original reported.
  #
  # This job expects to SKIP on a hosted runner: the original binary lives in a
  # reference checkout (BW_REFERENCE) that a clean runner does not have. The
  # SKIP names the missing tool and the ticket that turns the lane on, which is
  # the record this lane exists to make. On a self-hosted runner that carries
  # the reference tree the same step becomes the gate.
  parity:
    name: Compatibility differential against the reference tool
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'parity')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run the differential
        run: ci/parity.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-parity-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-00-02-01..05, BW-00-04-01, BW-00-04-02 and BW-00-04-03 — the reference
  # face: the original tree's commit, binary hashes and stated versions (the
  # baseline), its own unit tests rerun with list, command and result saved,
  # then the single-machine cluster face — topology, configuration and the
  # launch gate —, the minimal client login face — request, callbacks and the
  # capture gate —, the wire protocol face — every registered message with
  # its id, length style and direction, plus the framing those ids use —, the
  # Python logon callback face — the callback sequence, its arguments and the
  # fields a differential run must ignore —, the fixture face — the resource
  # bundle, the entity definitions and the database seed, each
  # content-addressed —, and the Windows client and tools baseline — per-target
  # result or gap — the same way local and CI run them.
  # A hosted runner has no reference checkout, so the job records the honest
  # SKIP naming the missing tree; the self-test in the harness job proves the
  # collection itself bites, and the durable record lives under
  # tests/baseline/ in the repo.
  refbase:
    name: Reference record and tests
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'refbase')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Record the reference baseline
        run: ci/reference-baseline.sh

      - name: Rerun the reference unit tests
        run: ci/reference-tests.sh

      - name: Record the reference cluster baseline
        run: ci/reference-cluster.sh

      - name: Record the reference login face
        run: ci/reference-login.sh

      - name: Record the reference wire protocol
        run: ci/reference-protocol.sh

      - name: Record the reference python logon callback
        run: ci/reference-callback.sh

      - name: Record the reference fixtures
        run: ci/reference-fixtures.sh

      - name: Record the original and new full-stack comparison
        run: ci/compare-fullstack.sh

      - name: Record the single-component replacement run
        run: ci/replace-role.sh

      - name: Locate the compatibility differences
        run: ci/compat-report.sh

      - name: Record the coverage ledger fields
        run: ci/coverage-ledger.sh

      - name: Map the engine library and server targets
        run: ci/map-coverage.sh

      - name: Record the reference windows baseline
        run: ci/reference-winbaseline.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-refbase-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-02-05 — SDK and plugin cases: does a produced artifact load in a
  # host? Three of the four substrates do not exist yet, so those cases SKIP
  # and name the ticket that turns them on (BW-21-01-01, BW-13-06-03,
  # BW-20-03-03). The fourth — a produced artifact loaded by a host process —
  # runs for real: the extension core is built here and then loaded by node.
  sdk:
    name: SDK and plugin host-load cases
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'sdk')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The lane's one live case loads the compiled extension core, so the
      # core has to be produced here — out/ is not checked in.
      - name: pnpm
        run: npm install --no-fund --no-audit --global pnpm@12

      # pnpm 12 aborts the install on ignored postinstall scripts (vsce-sign,
      # keytar) even though tsc itself is already in place — the same behaviour
      # the TypeScript lane tolerates by gating on the toolchain rather than
      # the installer's exit code. So the install is not the gate: tsc runs
      # from node_modules directly, and a tree without a usable tsc fails
      # right here.
      - name: Build the extension core
        run: |
          cd extensions/vscode
          pnpm install --frozen-lockfile --prefer-offline || true
          ./node_modules/.bin/tsc -p .

      - name: Run the SDK and plugin cases
        run: ci/sdk.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-sdk-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-03-01 — the PR short load test. The scenario set (BW-17-03-05) and
  # the driver crate (BW-17-01-01) do not exist yet, so every case SKIPs and
  # names its ticket; the day the substrate lands, the same step runs the
  # scenarios and records their results.
  load:
    name: PR short load test
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'load')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run the short load scenarios
        run: ci/load.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-load-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-03-03 — the fault drill: run the process-fault fixtures through the
  # shared entry and leave topology, archive and log behind whatever the
  # outcome. The lane follows the harness crate that provides the fixtures,
  # so a fixture change re-runs the drill on push; on-demand drills go
  # through fault-scenarios.yml.
  fault:
    name: Fault drill
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'fault')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Run the fault drill
        run: ci/fault.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-fault-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-03-04 — the comparison report: one record that makes two runs
  # comparable. Version, hardware, scenario and database sections are read
  # back before the lane passes, so a report missing a section cannot ship.
  # The scenario section reflects whatever archives and load records this
  # checkout holds; the compare section needs a baseline (report.yml). No
  # Rust is needed here: the report reads, it does not build.
  report:
    name: Comparison report
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'report')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Generate the comparison report
        run: ci/report.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-report-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-04-01 — the installer lane: build, stage, archive and smoke-launch
  # the server package for this platform. The full three-target face lives in
  # package-daily.yml; this job proves the lane on push for the one target
  # that compiles today (Linux — see the runners job for the other two).
  package:
    name: Installer package and launch smoke
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'package')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust (pinned by rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Package and smoke-launch
        run: ci/package.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-package-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-04-02 — the docs release lane: build the site, stamp a versioned
  # index, archive it, and require version metadata to agree across every
  # source (workspace Cargo.toml, docs/package.json, a declared siteVersion,
  # the index stamp against the live commit).
  docspkg:
    name: Docs site package and version index
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'docspkg')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: pnpm
        run: npm install --no-fund --no-audit --global pnpm@12

      - name: Package the docs site
        run: ci/docs-package.sh

      - name: Upload the site package
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: docs-package-${{ github.run_id }}
          path: ci-out/docs/
          retention-days: 14
          if-no-files-found: warn

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-docspkg-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-04-03 — engine SDK archives: each adapter tree under sdk/engines/
  # is archived and must prove importability from an empty project through
  # its own import-check. Every engine SKIPs and names its ticket until
  # BW-21 lands the trees; a started tree that cannot prove importability
  # fails here rather than at handoff.
  sdkarc:
    name: Engine SDK archives and import smoke
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'sdkarc')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Archive the engine SDKs
        run: ci/sdk-archive.sh

      - name: Upload the archives
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sdk-archives-${{ github.run_id }}
          path: ci-out/sdk/
          retention-days: 14
          if-no-files-found: warn

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-sdkarc-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # BW-22-04-04 — the VSIX lane: compile the extension fresh, package it
  # with its own vsce, verify the archive's integrity (manifest, package,
  # main entry, versions agreeing) and prove the installed core loads from
  # a clean host. The editor leg reports SKIP until BW-20-03-03 lands
  # @vscode/test-electron.
  vsix:
    name: VSIX package and clean-host install
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'vsix')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: pnpm
        run: npm install --no-fund --no-audit --global pnpm@12

      - name: Package the extension
        run: ci/vsix.sh

      - name: Upload the vsix
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix-${{ github.run_id }}
          path: ci-out/vsix/*.vsix
          retention-days: 14
          if-no-files-found: warn

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-vsix-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn

  # Runs whenever ci/ itself moves: each lane must still be able to go red on
  # a planted defect. This is the guard against a gate that quietly stops
  # meaning anything.
  harness:
    name: Harness self-tests
    needs: changes
    if: contains(needs.changes.outputs.lanes, 'ci')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          # check-rust.sh self-test formats and lints a bait crate.
          components: rustfmt clippy

      - name: Python
        uses: actions/setup-python@v6
        with:
          # The single pin file, same pattern as rust-toolchain.toml.
          python-version-file: .python-version

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install the lanes' dependencies
        run: |
          pip install pytest
          npm install --no-fund --no-audit --global typescript@5

      - name: Prove every lane bites
        run: |
          ci/check-rust.sh self-test
          ci/check-python.sh self-test
          ci/check-typescript.sh self-test
          ci/check-docs.sh self-test
          ci/runners.sh self-test
          ci/parity.sh self-test
          ci/sdk.sh self-test
          ci/load.sh self-test
          ci/fault.sh self-test
          ci/report.sh self-test
          ci/package.sh self-test
          ci/docs-package.sh self-test
          ci/sdk-archive.sh self-test
          ci/vsix.sh self-test
          ci/checksums.sh self-test
          ci/reference-baseline.sh self-test
          ci/reference-tests.sh self-test
          ci/reference-cluster.sh self-test
          ci/reference-login.sh self-test
          ci/reference-protocol.sh self-test
          ci/reference-callback.sh self-test
          ci/reference-fixtures.sh self-test
          ci/compare-fullstack.sh self-test
          ci/replace-role.sh self-test
          ci/compat-report.sh self-test
          ci/coverage-ledger.sh self-test
          ci/map-coverage.sh self-test
          ci/reference-winbaseline.sh self-test
          ci/archive-results.sh self-test

      - name: Bundle results
        # Always: a green run's manifest is what the archive lane verifies, and
        # a red one is the whole point of keeping it retrievable.
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-harness-${{ github.run_id }}
          path: ci-results/
          retention-days: 14
          if-no-files-found: warn
