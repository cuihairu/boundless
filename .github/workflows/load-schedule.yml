name: Load schedule

# BW-22-03-02 — scheduled capacity and soak tasks.
#
# Capacity and soak share one face: they run the same scenario contract as
# the PR short lane (ci/load.sh), just with bigger knobs. A scheduled run is
# the soak shape — default clients over a long budget; a manual dispatch is
# the capacity shape — high concurrency over a bounded window. Both are set
# per run through the inputs below.
#
# Schedule events always run against the default branch's HEAD, so the
# nightly measures whatever main carries. The scenario set (BW-17-03-06) and
# driver crate (BW-17-01-01) do not exist yet, so each run SKIPs and names
# its ticket; the day the substrate lands, this same workflow starts
# producing comparable numbers with no workflow change.
#
# This workflow publishes no artifacts anywhere and tags nothing — it
# records results into run artifacts, which is as far as automation goes.
# Versioned reports and releases stay user-triggered.

on:
  schedule:
    # Daily at 02:17 UTC — deliberately off the round minutes every other
    # scheduled job in the world piles onto.
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      clients:
        description: Concurrent scenario clients (LOAD_CLIENTS)
        type: string
        default: '32'
      duration:
        description: Wall budget per scenario in seconds (LOAD_DURATION)
        type: string
        default: '600'

permissions:
  contents: read

concurrency:
  group: load-schedule
  cancel-in-progress: false

jobs:
  load-schedule:
    name: Capacity and soak scenarios
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Run the capacity and soak scenarios
        env:
          CI_LOAD_CLIENTS: ${{ inputs.clients || '32' }}
          CI_LOAD_DURATION: ${{ inputs.duration || '600' }}
        run: ci/load.sh

      # BW-22-03-04 — the nightly's comparison report lands next to its load
      # records in the same artifact, so two nights can be joined on any row
      # (version, hardware, scenario, database).
      - name: Generate the comparison report
        if: always()
        run: ci/report.sh

      - name: Bundle results
        if: always()
        run: ci/archive-results.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ci-results-load-schedule-${{ github.run_id }}
          path: ci-results/
          retention-days: 30
          if-no-files-found: warn
