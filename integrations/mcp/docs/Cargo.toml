[package]
name = "boundless-docs-mcp"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
description = "Versioned VitePress documentation index served over the Model Context Protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

